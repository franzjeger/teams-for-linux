name: Deploy Docusaurus Documentation
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Restrict default permissions — each job declares only what it needs
permissions: {}

defaults:
  run:
    shell: bash
    working-directory: docs-site

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # Not needed if lastUpdatedBy and editUrl are disabled

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/build

  deploy:
    name: Deploy to GitHub Pages
    # Add a dependency to the build job
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    # Only deploy on main branch pushes, and only from the upstream repository.
    # A fork has no Pages site configured, so the deploy step fails in about a
    # second and takes the whole run red even though the site built fine.
    # The repository is spelled out rather than read from env, because job-level
    # `if` has no access to the env context.
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && github.repository == 'IsmaelMartinez/teams-for-linux'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  test-build:
    name: Test Build (PR/Branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Only run for PRs and non-main branch pushes
    if: github.ref != 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test build
        run: npm run build

      - name: Test serve (quick check)
        run: |
          npm run serve &
          SERVER_PID=$!
          # Wait for server to start
          sleep 5
          # Quick health check
          curl -f http://localhost:3000/ || (echo "Build test failed - server not responding" && exit 1)
          # Kill the server
          kill $SERVER_PID