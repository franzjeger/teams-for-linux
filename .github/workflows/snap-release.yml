name: Snap Release

on:
  release:
    types: [published]

# Restrict default permissions — each job declares only what it needs
permissions: {}

defaults:
  run:
    shell: bash

jobs:
  snap-candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
      SNAPCRAFT_BUILD_ENVIRONMENT: lxd

    steps:
      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@fceeb3c308e76f3487e72ef608618de625fb7fe8 # v3.0.1

      - name: Install and initialize LXD
        uses: canonical/setup-lxd@da2ac84e727dc534215fd14cd088b9209d65893b # main

      - name: Check out Git repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Node.js and NPM
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build snap
        run: npm run dist:linux:snap -- --publish never

      - name: Publish to candidate channel
        run: |
          SNAP_FILE=$(ls dist/*.snap)
          echo "Uploading ${SNAP_FILE} to candidate channel"
          snapcraft upload "${SNAP_FILE}" --release=candidate

  snap-candidate-armv7l:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
      # Note: No LXD - electron-builder handles armv7l cross-compilation directly

    steps:
      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@fceeb3c308e76f3487e72ef608618de625fb7fe8 # v3.0.1

      - name: Check out Git repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Node.js and NPM
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build snap
        run: npm run dist:linux:snap:armv7l -- --publish never

      - name: Publish to candidate channel
        run: |
          SNAP_FILE=$(ls dist/*.snap)
          echo "Uploading ${SNAP_FILE} to candidate channel"
          snapcraft upload "${SNAP_FILE}" --release=candidate

  snap-candidate-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
      SNAPCRAFT_BUILD_ENVIRONMENT: lxd

    steps:
      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@fceeb3c308e76f3487e72ef608618de625fb7fe8 # v3.0.1

      - name: Install and initialize LXD
        uses: canonical/setup-lxd@da2ac84e727dc534215fd14cd088b9209d65893b # main

      - name: Check out Git repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Node.js and NPM
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build snap
        run: npm run dist:linux:snap:arm64 -- --publish never

      - name: Publish to candidate channel
        run: |
          SNAP_FILE=$(ls dist/*.snap)
          echo "Uploading ${SNAP_FILE} to candidate channel"
          snapcraft upload "${SNAP_FILE}" --release=candidate
