name: Snap Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Restrict default permissions — each job declares only what it needs
permissions: {}

# Publishing happens only from the upstream repository. A fork builds the same
# snap but must not try to upload it: it has no store credentials, and
# electron-builder fails the whole job on the upload step rather than after a
# successful build, which makes a fork's main permanently red.
env:
  PUBLISH_FROM: IsmaelMartinez/teams-for-linux

defaults:
  run:
    shell: bash

jobs:
  snap:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
      SNAPCRAFT_BUILD_ENVIRONMENT: lxd

    steps:
      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@fceeb3c308e76f3487e72ef608618de625fb7fe8 # v3.0.1

      - name: Install and initialize LXD
        uses: canonical/setup-lxd@da2ac84e727dc534215fd14cd088b9209d65893b # main

      - name: Check out Git repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Node.js and NPM
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Build
        run: npm ci

      - name: Set edge version with commit SHA
        if: github.ref == 'refs/heads/main'
        run: |
          SHA=$(git rev-parse --short HEAD)
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version += '-edge.g${SHA}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Snap edge version: $(node -p "require('./package.json').version")"

      - name: Build for Release
        if: github.ref == 'refs/heads/main' && github.repository == env.PUBLISH_FROM
        run: npm run dist:linux:snap -- --publish always

      - name: Build without publishing
        if: github.ref != 'refs/heads/main' || github.repository != env.PUBLISH_FROM
        run: npm run dist:linux:snap -- --publish never

      - name: Upload build artifacts
        if: github.ref != 'refs/heads/main' || github.repository != env.PUBLISH_FROM
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: teams-for-linux-snap-x64
          path: dist/*.snap
          retention-days: 30
          compression-level: 0

  snap-armv7l:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
      # LXD is required since the core24 migration: the old core22 path built
      # through the app-builder Go binary and could cross-compile armv7l
      # directly, but core24 runs `snapcraft pack`, which needs a build
      # environment. Without this, snapcraft tries to install LXD itself and
      # fails because the runner user is not in the 'lxd' group.
      SNAPCRAFT_BUILD_ENVIRONMENT: lxd

    steps:
      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@fceeb3c308e76f3487e72ef608618de625fb7fe8 # v3.0.1

      - name: Install and initialize LXD
        uses: canonical/setup-lxd@da2ac84e727dc534215fd14cd088b9209d65893b # main

      - name: Check out Git repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Node.js and NPM
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Build
        run: npm ci

      - name: Set edge version with commit SHA
        if: github.ref == 'refs/heads/main'
        run: |
          SHA=$(git rev-parse --short HEAD)
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version += '-edge.g${SHA}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Snap edge version: $(node -p "require('./package.json').version")"

      - name: Build for Release
        if: github.ref == 'refs/heads/main' && github.repository == env.PUBLISH_FROM
        run: npm run dist:linux:snap:armv7l -- --publish always

      - name: Build without publishing
        if: github.ref != 'refs/heads/main' || github.repository != env.PUBLISH_FROM
        run: npm run dist:linux:snap:armv7l -- --publish never

      - name: Upload build artifacts
        if: github.ref != 'refs/heads/main' || github.repository != env.PUBLISH_FROM
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: teams-for-linux-snap-armv7l
          path: dist/*.snap
          retention-days: 30
          compression-level: 0

  snap-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
      SNAPCRAFT_BUILD_ENVIRONMENT: lxd

    steps:
      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@fceeb3c308e76f3487e72ef608618de625fb7fe8 # v3.0.1

      - name: Install and initialize LXD
        uses: canonical/setup-lxd@da2ac84e727dc534215fd14cd088b9209d65893b # main

      - name: Check out Git repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Node.js and NPM
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Build
        run: npm ci

      - name: Set edge version with commit SHA
        if: github.ref == 'refs/heads/main'
        run: |
          SHA=$(git rev-parse --short HEAD)
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version += '-edge.g${SHA}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Snap edge version: $(node -p "require('./package.json').version")"

      - name: Build for Release
        if: github.ref == 'refs/heads/main' && github.repository == env.PUBLISH_FROM
        run: npm run dist:linux:snap:arm64 -- --publish always

      - name: Build without publishing
        if: github.ref != 'refs/heads/main' || github.repository != env.PUBLISH_FROM
        run: npm run dist:linux:snap:arm64 -- --publish never

      - name: Upload build artifacts
        if: github.ref != 'refs/heads/main' || github.repository != env.PUBLISH_FROM
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: teams-for-linux-snap-arm64
          path: dist/*.snap
          retention-days: 30
          compression-level: 0

